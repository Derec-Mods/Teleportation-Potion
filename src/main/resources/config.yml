#  name/lore use & color codes for minecraft
# color is the bottle tint as hex (e.g. #1AEDED)
# starter-bottles is how many potions a first-join player gets
potion:
  name: "&dTeleportation Potion"
  lore:
    - "&7/rtp but in a bottle!"
  color: "#1AEDED"
  starter-bottles: 3

# world = overworld name
# min/max-range = distance from 0,0 (setting max to 0 will use the world border)
# pool-size = ready spots kept in memory
# refill-interval-ticks = how often we top the pool up 
# attempts-per-cycle = new spots tried each refill
# max-find-attempts = retries per search
# samples-per-chunk = checks inside one chunk
# generate-chunks = if new chunks should be generated during the search, or if we should only use existing chunks already generated in the world
# max-ungenerated-skips = the actual hard stop of checks 
# max-inhabited-ticks = maximum number of ticks before a chunk is counted as invalid (to prevent players from teleporting to established bases)
rtp:
  world: world
  min-range: 500
  max-range: 5000
  pool-size: 16
  refill-interval-ticks: 100
  attempts-per-cycle: 2
  max-find-attempts: 40
  samples-per-chunk: 8
  generate-chunks: true
  max-ungenerated-skips: 2000
  max-inhabited-ticks: 72000
